<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꽃게당 Premium High-Res Display</title>
    <style>
        /* [고해상도 전용 설정]
           - 기준 해상도: 3840px x 2160px (4K UHD)
           - PC 환경이나 고성능 셋톱박스에서 전체화면(F11)으로 재생 시 최적화됨
        */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%; height: 100%;
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* 배경 이미지도 고해상도로 교체 권장 */
        #intro {
            width: 100%; height: 100%;
            /* 아래 배경 이미지도 4K급으로 교체 필요 */
            background: url('https://raw.githubusercontent.com/BenCizion/Att_self/main/bg_img_06.png') center/cover no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        h1 {
            color: #fff; 
            font-size: 80px; /* 4K 해상도에 맞춰 폰트 크기 대폭 확대 */
            margin-bottom: 60px; 
            padding: 20px 50px;
            background-color: rgba(0,0,0,0.6); 
            border-radius: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
        }

        /* 4K 플레이어 영역 설정 */
        .player-area {
            width: 3840px; 
            height: 2160px;
            /* 화면이 4K보다 작을 경우를 대비해 비율 유지하며 축소 (contain) */
            max-width: 95vw; 
            max-height: 95vh;
            aspect-ratio: 16/9;
            
            position: relative; 
            background: #111; 
            overflow: hidden; 
            display: flex;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        #board01 {
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 10px; /* 고해상도에 맞춰 간격 확대 */
            overflow: hidden;
            background-color: #222;
        }

        /* 미디어 요소 스타일 */
        #board01 img, #board01 video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
            
            /* 고화질 렌더링 힌트 */
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0);
        }
    </style>
</head>
<body>
    <div id="intro">
        <h1>Instagram #꽃게당 #Premium #HighRes</h1>
        <div class="player-area" id="mainPlayerArea">
            <div id="board01">
                <!-- 
                   [중요] 아래 src 경로에 4K 또는 FHD급 고화질 소스를 넣어주세요.
                   현재는 기존 소스가 들어있어 4K 화면에서 흐리게 보일 수 있습니다.
                -->
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/Q1.webp" />
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/Q2.webp" />
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/Q3.webp" />
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/Q4.webp" />
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/Q5.webp" />
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/Q6.webp" />
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/Q7.webp" />
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/Q8.webp" />
            </div>
        </div>
    </div>
</body>
</html>
