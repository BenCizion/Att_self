<!DOCTYPE html> 
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rolling Viewer (resume YouTube)</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; }
    #viewer {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      opacity: 1;
      transition: opacity 0.9s;
    }
    #viewer.fadeout { opacity: 0; }
  </style>
</head>
<body>
  <iframe id="viewer" src="boa1.html"></iframe>

<script>
  // 페이지 목록 (이미지 페이지, 비디오 페이지)
  const pages = ["boa1.html", "boaYoutube.html"];
  const intervals = [10000, 10000];
  let current = 0;
  let timeoutId = null;
  const viewer = document.getElementById("viewer");

  // preload related
  const PRELOAD_RANGE = 2;
  const preloaded = new Set();

  // 저장된 재생 위치 저장소 (페이지별)
  const playbackTimes = {}; // e.g. playbackTimes['boaYoutube.html'] = seconds

  // 보안용 origin (같은 호스트에서 제공하므로 location.origin 사용)
  const PARENT_ORIGIN = location.origin;

  // 메시지 수신: iframe(boaYoutube.html)에서 재생 시간/준비 신호 수신
  window.addEventListener('message', (ev) => {
    // 보안: 발신 origin이 같지 않으면 무시
    if (ev.origin !== PARENT_ORIGIN) return;
    const d = ev.data || {};
    if (d && d.type === 'yt-time' && typeof d.time === 'number') {
      // 주기적으로 또는 on-unload로 보낸 현재 시간 저장
      playbackTimes['boaYoutube.html'] = d.time;
      console.debug('[parent] received yt-time', d.time);
    }
    if (d && d.type === 'yt-ready') {
      // 자식이 준비되면 저장된 위치가 있으면 seek 명령 전송
      const t = playbackTimes['boaYoutube.html'];
      if (typeof t === 'number' && !isNaN(t) && t > 0) {
        // seek 명령 전송
        try {
          viewer.contentWindow.postMessage({ type: 'yt-seek', time: t, source: 'parent' }, PARENT_ORIGIN);
          console.debug('[parent] sent yt-seek', t);
        } catch (e) {
          console.warn('[parent] postMessage yt-seek failed', e);
        }
      }
    }
  });

  // PRELOAD helpers
  function addPreloadHint(href) {
    try {
      const linkP = document.createElement('link');
      linkP.rel = 'preload';
      linkP.href = href;
      linkP.as = 'document';
      document.head.appendChild(linkP);

      const linkF = document.createElement('link');
      linkF.rel = 'prefetch';
      linkF.href = href;
      linkF.as = 'document';
      document.head.appendChild(linkF);
    } catch (e) {
      console.warn('preload hint failed for', href, e);
    }
  }

  async function warmFetch(href) {
    try {
      await fetch(href, { method: 'GET', credentials: 'same-origin', cache: 'force-cache' });
      console.info('[warmFetch] fetched', href);
    } catch (e) {
      console.warn('[warmFetch] fetch failed for', href, e);
    }
  }

  function prioritizePreload(page) {
    if (preloaded.has(page)) return;
    preloaded.add(page);
    addPreloadHint(page);
    warmFetch(page);
    console.info('[prioritizePreload] prioritized', page);
  }

  function preloadNextPages(startIdx) {
    for (let i = 1; i <= PRELOAD_RANGE; i++) {
      let idx = (startIdx + i) % pages.length;
      let page = pages[idx];
      if (!preloaded.has(page)) {
        addPreloadHint(page);
        warmFetch(page);
        preloaded.add(page);
        console.info('[preloadNextPages] preloaded', page);
      }
    }
  }

  // next page
  function nextPage() {
    // If current page is boaYoutube.html, ask iframe to send current time before switching.
    if (pages[current] === 'boaYoutube.html') {
      try {
        viewer.contentWindow.postMessage({ type: 'yt-request-time' }, PARENT_ORIGIN);
      } catch (e) {
        console.warn('[parent] yt-request-time failed', e);
      }
      // give short time for iframe to respond with yt-time (it also sends periodically)
    }

    viewer.classList.add('fadeout');
    setTimeout(() => {
      current = (current + 1) % pages.length;
      viewer.src = pages[current];
      // next pages preload
      preloadNextPages(current);
    }, 900);
  }

  // interval control
  function startInterval() {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(nextPage, intervals[current]);
  }
  function stopInterval() {
    clearTimeout(timeoutId);
  }

  // when iframe loaded: if it's boaYoutube, parent will wait for yt-ready from child and then send seek.
  viewer.onload = function() {
    viewer.classList.remove('fadeout');
    startInterval();

    // If the newly loaded page is boaYoutube.html and we already have a stored time,
    // we also attempt to send yt-seek after a short delay in case child is ready quickly.
    if (pages[current] === 'boaYoutube.html') {
      const t = playbackTimes['boaYoutube.html'];
      if (typeof t === 'number' && t > 0) {
        setTimeout(() => {
          try {
            viewer.contentWindow.postMessage({ type: 'yt-seek', time: t, source: 'parent' }, PARENT_ORIGIN);
            console.debug('[parent] proactive yt-seek sent', t);
          } catch (e) { /* ignore */ }
        }, 500);
      }
    }
  };

  document.addEventListener("visibilitychange", function() {
    if (document.hidden) stopInterval();
    else startInterval();
  });

  window.addEventListener("beforeunload", stopInterval);

  // start: prioritize boaYoutube preload and kick things off
  window.addEventListener('load', function() {
    prioritizePreload('boaYoutube.html'); // raise priority for slow page
    preloadNextPages(0);
    startInterval();
  });

  if (document.readyState === 'complete') {
    prioritizePreload('boaYoutube.html');
    preloadNextPages(0);
    startInterval();
  }
</script>
</body>
</html>
