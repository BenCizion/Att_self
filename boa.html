<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rolling Viewer (prio preload for boaYoutube)</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; }
    #viewer {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      opacity: 1;
      transition: opacity 0.9s;
    }
    #viewer.fadeout { opacity: 0; }
  </style>
</head>
<body>
  <iframe id="viewer" src="boa1.html"></iframe>

<script>
  // 페이지 목록 (이미지 페이지, 비디오 페이지)
  const pages = ["boa1.html", "boaYoutube.html"];
  // 각 페이지별 표시 시간(ms)
  const intervals = [10000, 10000];
  let current = 0;
  let timeoutId = null;
  const viewer = document.getElementById("viewer");

  // 프리로드 범위(연속으로 미리 불러올 페이지 수)
  const PRELOAD_RANGE = 2;

  // 이미 프리로드한 링크 중복 방지
  const preloaded = new Set();

  // 일반적인 preload (link rel=preload + rel=prefetch)
  function addPreloadHint(href) {
    try {
      // preload (higher priority)
      const linkP = document.createElement('link');
      linkP.rel = 'preload';
      linkP.href = href;
      linkP.as = 'document';
      // for same-origin documents, crossorigin isn't necessary; left out intentionally
      document.head.appendChild(linkP);

      // prefetch (lower priority fallback)
      const linkF = document.createElement('link');
      linkF.rel = 'prefetch';
      linkF.href = href;
      linkF.as = 'document';
      document.head.appendChild(linkF);
    } catch (e) {
      console.warn('preload hint failed for', href, e);
    }
  }

  // fetch로 콘텐츠를 미리 요청하여 브라우저 캐시를 워밍업
  async function warmFetch(href) {
    try {
      // GET 요청을 보내서 HTML 리소스를 캐시에 넣습니다.
      // 동일 출처이므로 정상 동작하고, 리소스가 캐시되면 iframe 로딩이 빨라집니다.
      await fetch(href, { method: 'GET', credentials: 'same-origin', cache: 'force-cache' });
      console.info('[warmFetch] fetched', href);
    } catch (e) {
      console.warn('[warmFetch] fetch failed for', href, e);
    }
  }

  // 우선순위 프리로드: 빠르게 가져오고 캐시 워밍업까지 시도
  function prioritizePreload(page) {
    if (preloaded.has(page)) return;
    preloaded.add(page);
    addPreloadHint(page);
    // 비동기 fetch로 캐시 워밍업(백그라운드)
    warmFetch(page);
    // 콘솔 안내
    console.info('[prioritizePreload] prioritized', page);
  }

  // 여러 페이지 프리로드 (기존 로직을 유지)
  function preloadNextPages(startIdx) {
    for (let i = 1; i <= PRELOAD_RANGE; i++) {
      let idx = (startIdx + i) % pages.length;
      let page = pages[idx];
      if (!preloaded.has(page)) {
        addPreloadHint(page);
        // 약한 캐시 워밍업: prefetch 수준으로 fetch 시도(비동기)
        warmFetch(page);
        preloaded.add(page);
        console.info('[preloadNextPages] preloaded', page);
      }
    }
  }

  // 다음 페이지로 전환
  function nextPage() {
    viewer.classList.add('fadeout');
    setTimeout(() => {
      current = (current + 1) % pages.length;
      viewer.src = pages[current];
      // 다음 PRELOAD_RANGE개 페이지 프리로드
      preloadNextPages(current);
    }, 900);
  }

  // interval 시작/정지
  function startInterval() {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(nextPage, intervals[current]);
  }
  function stopInterval() {
    clearTimeout(timeoutId);
  }

  // iframe 로드 완료 시
  viewer.onload = function() {
    viewer.classList.remove('fadeout');
    startInterval();
  };

  // visibility 처리
  document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
      stopInterval();
    } else {
      startInterval();
    }
  });

  window.addEventListener("beforeunload", stopInterval);

  // =====================
  // 시작 시점: boaYoutube.html의 프리로드 우선순위를 높임
  // =====================

  window.addEventListener('load', function() {
    // 1) 즉시 우선 프리로드 대상 지정 (boaYoutube가 느리므로 우선 캐시)
    prioritizePreload('boaYoutube.html');

    // 2) 기존 preloadNextPages 호출 (첫 화면 기준)
    preloadNextPages(0);

    // 3) 일반 인터벌 시작
    startInterval();
  });

  // 안전망: 만약 load가 이미 발생했으면 바로 실행
  if (document.readyState === 'complete') {
    prioritizePreload('boaYoutube.html');
    preloadNextPages(0);
    startInterval();
  }
</script>
</body>
</html>
