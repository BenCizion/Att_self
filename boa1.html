<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>보아치과 인스타그램 TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh; min-height: 100vh;
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }
        #intro {
            width: 100vw; height: 100vh;
            background: url('https://raw.githubusercontent.com/BenCizion/Att_self/main/files/보아치과1.png') center/cover no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        h1 {
            color: #fff; font-size: 24px; margin-bottom: 20px; padding: 10px 20px;
            background-color: rgba(0,0,0,0.6); border-radius: 8px;
        }
        .player-area {
            width: 1280px; height: 720px;
            max-width: 90vw; max-height: 70vw;
            position: relative; background: #000; overflow: hidden; display: flex;
        }
        #board01 {
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 4px;
            overflow: hidden;
        }
        #board01 video,
        #board01 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
            aspect-ratio: 16/9;
        }
    </style>
</head>
<body>
    <div id="intro">
        <h1>Instagram #보아치과 #BoaClinic</h1>
        <div class="player-area" id="mainPlayerArea">  <!--<video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/boa/" autoplay muted loop playsinline preload="auto"></video> -->
            <div id="board01">
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/boa/boa1.jpg" alt="" />             
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/boa/boa2.jpg" alt="" />      
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/boa/boa3.jpg" alt="" />      
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/boa/boa4.jpg" alt="" />      
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/boa/boa5.jpg" alt="" />      
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/boa/boa6.jpg" alt="" />      
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/boa/boa7.webp" alt="" />      
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/boa/boa8.jpg" alt="" />      
            </div>
        </div>
    </div>
</body>
</html>
