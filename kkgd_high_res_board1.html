<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꽃게당 인스타그램 TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh; min-height: 100vh;
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }

        /* Intro / background */
        #intro {
            width: 100vw; height: 100vh;
            background: url('https://raw.githubusercontent.com/BenCizion/Att_self/main/꽃게당 배경 패턴(용량)_6.webp') center/cover no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        /* h1을 크게, 반응형으로 보이게 수정 */
        h1 {
            color: #fff;
            /* 반응형 큰 글자: 최소 28px, 화면비례로 확대, 최대 120px */
            font-size: clamp(28px, 3.5vw + 1rem, 120px);
            line-height: 1.05;
            margin-bottom: 0;
            padding: 14px 28px;
            background-color: rgba(0,0,0,0.6);
            border-radius: 8px;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.02);
            letter-spacing: 0.02em;
        }

        /* Player area: responsive 16:9 that will fit a 3840x2160 (4K) TV
           - width limited to viewport width or 3840px (native 4K width)
           - aspect-ratio keeps exact 16:9
           - max-height ensures it never overflows the screen height
        */
        .player-area {
            width: min(100vw, 3840px);
            aspect-ratio: 16 / 9;
            height: auto;                 /* computed from aspect-ratio */
            max-height: 100vh;            /* never exceed viewport height */
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: stretch;
            justify-content: center;
            border-radius: 4px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
        }

        /* Board grid: keeps 4 x 2 grid cells that fill the 16:9 player-area */
        #board01 {
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            overflow: hidden;
            padding: 6px; /* small inner gap so items don't touch edges on TV */
            box-sizing: border-box;
            background: #000;
        }

        /* Each media item fills its grid cell and maintains cover behavior */
        #board01 video,
        #board01 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
        }

        /* Improve video rendering on large screens */
        video {
            -webkit-font-smoothing: antialiased;
            image-rendering: auto;
        }

        /* Responsive tweaks for smaller displays (mobile/dev) */
        @media (max-aspect-ratio: 16/9) {
            /* If viewport is taller than 16:9, limit width to viewport minus padding */
            .player-area { width: calc(100vh * 16 / 9); max-width: 100vw; }
        }
    </style>
</head>
<body>
    <div id="intro">
        <h1>Instagram #꽃게당 #KkotGeDang #シンサコッケタン</h1>
        <div class="player-area" id="mainPlayerArea">
            <div id="board01">
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251205_173226532_01.webp" alt="" />             
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133917786.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133920425.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133922768.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251031_175432012.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251031_175433056.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/kkd_25Y09M_2.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20250904_140819902.mp4" autoplay muted loop playsinline preload="auto"></video>
            </div>
        </div>
    </div>
</body>
</html>
