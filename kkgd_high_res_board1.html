<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꽃게당 인스타그램 TV - 4K UHD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh; min-height: 100vh;
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        #intro {
            width: 100vw; height: 100vh;
            background: url('https://raw.githubusercontent.com/BenCizion/Att_self/main/꽃게당 배경 패턴(용량)_6.webp') center/cover no-repeat;
            background-color: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        h1 {
            color: #fff; 
            font-size: clamp(36px, 5vw, 72px); 
            padding: 25px 40px;
            background-color: rgba(0,0,0,0.6); 
            border-radius: 16px; 
            backdrop-filter: blur(12px);
            text-align: center; 
            max-width: 90vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .player-area {
            width: min(3840px, 100vw); 
            height: min(1944px, calc(100vh - 120px));
            max-width: 100vw; 
            max-height: calc(90vh - 60px);
            position: relative; 
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            aspect-ratio: 16/9;
        }
        #board01 {
            width: 100%; height: 100%;
            max-width: 3840px; max-height: 1944px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px;
            padding: 4px;
            box-sizing: content-box;
        }
        .media-item {
            position: relative;
            width: 100%; height: 100%;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .media-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            background-size: cover;
            background-position: center;
            z-index: -1;
        }
        #board01 video,
        #board01 img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            z-index: 1;
        }
        #board01 video {
            object-position: center;
        }
        @media (max-aspect-ratio: 16/9) {
            .player-area { 
                width: 100vw; 
                height: calc(100vw * 9 / 16); 
            }
        }
        @media (min-aspect-ratio: 16/9) {
            .player-area { 
                height: calc(90vh - 60px); 
                width: calc((90vh - 60px) * 16 / 9); 
            }
        }
    </style>
</head>
<body>
    <div id="intro">
        <h1>Instagram #꽃게당 #KkotGeDang #シンサコッケタン</h1>
        <div class="player-area" id="mainPlayerArea">
            <div id="board01">
                <div class="media-item">
                    <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251205_173226532_01.webp" alt="꽃게당 콘텐츠 1" />
                </div>
                <div class="media-item">
                    <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133917786.mp4" 
                           autoplay muted loop playsinline preload="auto"></video>
                </div>
                <div class="media-item">
                    <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133920425.mp4" 
                           autoplay muted loop playsinline preload="auto"></video>
                </div>
                <div class="media-item">
                    <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133922768.mp4" 
                           autoplay muted loop playsinline preload="auto"></video>
                </div>
                <div class="media-item">
                    <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251031_175432012.mp4" 
                           autoplay muted loop playsinline preload="auto"></video>
                </div>
                <div class="media-item">
                    <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251031_175433056.mp4" 
                           autoplay muted loop playsinline preload="auto"></video>
                </div>
                <div class="media-item">
                    <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/kkd_25Y09M_2.mp4" 
                           autoplay muted loop playsinline preload="auto"></video>
                </div>
                <div class="media-item">
                    <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20250904_140819902.mp4" 
                           autoplay muted loop playsinline preload="auto"></video>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
