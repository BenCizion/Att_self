<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XML 호출 예제</title>
</head>
<body>

<h2>XML 호출 및 출력</h2>
<div id="xmlOutput"></div>

<script>
fetch('https://bencizion.github.io/Att_self/vast.xml')  // 여기에 XML 파일 URL 넣기
  .then(response => response.text())
  .then(str => {
    // XML 파싱
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(str, "application/xml");
    document.getElementById('xmlOutput').textContent = new XMLSerializer().serializeToString(xmlDoc);
  })
  .catch(error => {
    console.error("XML 로드 실패:", error);
  });
</script>

</body>
</html>
