<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>콘텐츠 보드</title>
    <style>
        /* 기본 스타일 및 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #f0f2f5;
        }

        /* 메인 컨테이너 */
        #attractt-container {
            width: 100%;
            /* 전체 컨테이너의 1:1 비율은 유지합니다. */
            aspect-ratio: 1 / 1; 
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        /* 그리드 레이아웃 */
        #content-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            padding: 5px;
        }
        
        /* ======================================= */
        /* ## 핵심 수정사항 (가장 확실한 방법) ## */
        /* ======================================= */
        
        /* 1. 그리드 아이템(칸)을 1:1 비율로 강제 */
        .grid-item {
            position: relative; /* 자식 요소(이미지/비디오)를 위한 기준점 */
            width: 100%;
            height: 0; /* 높이를 0으로 설정 */
            padding-bottom: 100%; /* 너비의 100%만큼 아래쪽 패딩을 주어 정사각형 생성 */
            overflow: hidden;
            border-radius: 8px;
            background-color: #e0e0e0;
        }

        /* 2. 미디어가 부모(grid-item)를 가득 채우도록 설정 */
        .grid-item img,
        .grid-item video {
            position: absolute; /* 부모(grid-item) 내부에 절대적으로 위치 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* object-fit: cover가 센터 포커싱 및 채우기 역할 */
            object-fit: cover; 
        }
        
        /* '더보기' 버튼 스타일 (현재는 사용되지 않음) */
        #load-more-btn {
            display: none;
        }
    </style>
</head>
<body>

    <main id="attractt-container">
        <section id="content-grid"></section>
        <button id="load-more-btn">더보기</button>
    </main>

    <script>
        // JavaScript는 변경 없이 이전과 동일합니다.
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('content-grid');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            const contentPattern = [
                { type: 'video', url: 'files/DNUjSRKzl3y_video.mp4' },
                { type: 'image', url: 'files/DNzdSs80tkd_image.jpg' }
            ];

            const initialContent = [];
            for (let i = 0; i < 4; i++) {
                initialContent.push(...contentPattern);
            }

            let currentPage = 0;
            const itemsPerLoad = 8;

            async function fetchData() {
                if (currentPage === 0) {
                    return initialContent;
                }
                return [];
            }

            function addItemsToGrid(items) {
                items.forEach(item => {
                    const itemElement = document.createElement('figure');
                    itemElement.className = 'grid-item';

                    if (item.type === 'video') {
                        itemElement.innerHTML = `<video src="${item.url}" autoplay muted loop playsinline></video>`;
                    } else {
                        itemElement.innerHTML = `<img src="${item.url}" alt="콘텐츠 이미지">`;
                    }
                    gridContainer.appendChild(itemElement);
                });
            }
            
            async function loadContent() {
                const newItems = await fetchData();
                
                if (newItems.length > 0) {
                    addItemsToGrid(newItems);
                    currentPage++;
                }
            }

            loadContent();
        });
    </script>
</body>
</html>
