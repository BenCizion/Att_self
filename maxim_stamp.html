<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>콘텐츠 보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #f0f2f5;
        }

        /* ======================================= */
        /* ## 핵심 수정사항 1 ## */
        /* ======================================= */
        #attractt-container {
            width: 100%;
            margin: 0 auto;
            /* aspect-ratio 고정을 제거하여 그리드가 자연스러운 크기를 갖도록 함 */
        }

        /* ======================================= */
        /* ## 핵심 수정사항 2 ## */
        /* ======================================= */
        #content-grid {
            width: 100%;
            display: grid;
            /* 2개의 열과 4개의 행을 명시적으로 정의 */
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr); /* ◀ 이 줄이 핵심 */
            gap: 5px;
            padding: 5px;
            /* 그리드 컨테이너 자체에 1:2 비율을 부여 (가로:세로) */
            /* 2개의 정사각형이 가로로 있으므로 너비는 2, 4개의 정사각형이 세로로 있으므로 높이는 4. 즉 2:4 = 1:2 비율 */
            aspect-ratio: 1 / 2;
        }
        
        /* ======================================= */
        /* ## 핵심 수정사항 3 ## */
        /* ======================================= */
        /* 복잡한 position, padding 트릭 제거하고 단순화 */
        .grid-item {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 8px;
            background-color: #e0e0e0;
        }

        .grid-item img,
        .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <main id="attractt-container">
        <section id="content-grid"></section>
    </main>

    <script>
        // JavaScript는 변경 없이 이전과 동일합니다.
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('content-grid');
            
            const contentPattern = [
                { type: 'video', url: 'files/DNUjSRKzl3y_video.mp4' },
                { type: 'image', url: 'files/DNzdSs80tkd_image.jpg' }
            ];

            const initialContent = [];
            for (let i = 0; i < 4; i++) {
                initialContent.push(...contentPattern);
            }

            function addItemsToGrid(items) {
                items.forEach(item => {
                    const itemElement = document.createElement('figure');
                    itemElement.className = 'grid-item';

                    if (item.type === 'video') {
                        itemElement.innerHTML = `<video src="${item.url}" autoplay muted loop playsinline></video>`;
                    } else {
                        itemElement.innerHTML = `<img src="${item.url}" alt="콘텐츠 이미지">`;
                    }
                    gridContainer.appendChild(itemElement);
                });
            }
            
            addItemsToGrid(initialContent);
        });
    </script>
</body>
</html>
