<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>콘텐츠 보드</title>
    <style>
        /* 기본 스타일 및 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #f0f2f5;
        }

        /* 1:1 비율을 유지하는 메인 컨테이너 */
        #attractt-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 그리드 레이아웃 */
        #content-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            padding: 5px;
            overflow-y: auto;
        }
        
        /* 그리드 아이템 스타일 */
        .grid-item {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 8px;
            background-color: #e0e0e0;
        }

        /* 이미지와 비디오 공통 스타일 */
        .grid-item img,
        .grid-item video {
            width: 100%;
            height: 100%;
            /* 아래 2개 속성으로 1:1 비율 및 채우기 처리 */
            object-fit: cover; /* 미디어가 컨테이너를 채우도록 함 (비율이 다르면 잘림) */
            aspect-ratio: 1 / 1; /* 미디어 자체의 비율을 1:1로 강제 */
            display: block;
        }
        
        /* '더보기' 버튼 스타일 */
        #load-more-btn {
            display: none;
            width: 100%;
            padding: 15px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <main id="attractt-container">
        <section id="content-grid"></section>
        <button id="load-more-btn">더보기</button>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('content-grid');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            // 반복할 콘텐츠 패턴 정의
            const contentPattern = [
                { type: 'video', url: 'files/DNUjSRKzl3y_video.mp4' },
                { type: 'image', url: 'files/DNzdSs80tkd_image.jpg' }
            ];

            // 패턴을 4번 반복하여 총 8개의 초기 콘텐츠 목록 생성
            const initialContent = [];
            for (let i = 0; i < 4; i++) {
                initialContent.push(...contentPattern);
            }

            let currentPage = 0;
            const itemsPerLoad = 8;

            async function fetchData() {
                if (currentPage === 0) {
                    return initialContent;
                }
                return [];
            }

            function addItemsToGrid(items) {
                items.forEach(item => {
                    const itemElement = document.createElement('figure');
                    itemElement.className = 'grid-item';

                    if (item.type === 'video') {
                        itemElement.innerHTML = `<video src="${item.url}" autoplay muted loop playsinline></video>`;
                    } else {
                        itemElement.innerHTML = `<img src="${item.url}" alt="콘텐츠 이미지">`;
                    }
                    gridContainer.appendChild(itemElement);
                });
            }
            
            async function loadContent() {
                const newItems = await fetchData();
                
                if (newItems.length > 0) {
                    addItemsToGrid(newItems);
                    currentPage++;
                }

                if (newItems.length === itemsPerLoad) {
                    loadMoreBtn.style.display = 'block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }
            }

            loadMoreBtn.addEventListener('click', loadContent);
            loadContent();
        });
    </script>
</body>
</html>
