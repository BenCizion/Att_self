<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꽃게당 인스타그램 TV - 4K UHD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100vw; 
            height: 100vh; 
            background-color: #000;
            overflow: hidden;
        }
        
        #intro {
            width: 100vw; 
            height: 100vh;
            background: url('https://raw.githubusercontent.com/BenCizion/Att_self/main/꽃게당 배경 패턴(용량)_6.webp') center/cover no-repeat fixed;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            position: relative;
        }
        
        h1 {
            color: #fff; 
            font-size: clamp(36px, 3.5vw, 80px); 
            margin-bottom: 20px;
            padding: 20px 40px;
            background-color: rgba(0,0,0,0.8); 
            border-radius: 20px;
            backdrop-filter: blur(15px);
            text-align: center;
            max-width: 95%;
            z-index: 10;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        
        .player-area {
            width: 100vw; 
            height: calc(100vh - 160px);
            position: relative; 
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        
        #board01 {
            width: 100%; 
            height: 100%;
            max-width: min(98vw, 3840px);
            max-height: min(98vh, 2160px);
            display: grid;
            /* 고정 4x2 그리드 */
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            grid-auto-rows: 1fr;
            gap: 8px;
            overflow: hidden;
            background: rgba(0,0,0,0.9);
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
            padding: 12px;
            box-sizing: border-box;
        }
        
        /* 모든 미디어 요소 동일 크기 강제 */
        #board01 > * {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
            border-radius: 8px;
        }
        
        /* 4K TV 최적화 */
        @media screen and (min-width: 3500px) {
            .player-area {
                padding: 20px;
                height: calc(100vh - 200px);
            }
            
            #board01 {
                gap: 12px;
                padding: 16px;
                border-radius: 24px;
            }
            
            h1 {
                font-size: 80px;
                padding: 25px 50px;
                margin-bottom: 25px;
            }
        }
        
        /* 비디오 성능 최적화 */
        video {
            will-change: transform;
        }
        
        /* TV 포커스 지원 */
        #board01:focus-within {
            box-shadow: 0 0 60px rgba(255, 165, 0, 0.6);
        }
    </style>
</head>
<body>
    <div id="intro">
        <h1>Instagram #꽃게당 #KkotGeDang #シンサコッケタン</h1>
        <div class="player-area" id="mainPlayerArea">
            <div id="board01">
                <img src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251205_173226532_01.webp" alt="꽃게당 콘텐츠" loading="eager" />             
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133917786.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133920425.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/KakaoTalk_20251216_133922768.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251031_175432012.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20251031_175433056.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/kkd_25Y09M_2.mp4" autoplay muted loop playsinline preload="auto"></video>
                <video src="https://raw.githubusercontent.com/BenCizion/Att_self/main/files/KakaoTalk_20250904_140819902.mp4" autoplay muted loop playsinline preload="auto"></video>
            </div>
        </div>
    </div>
</body>
</html>
