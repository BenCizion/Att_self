<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro +  Board Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
    }

    #intro, #board {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    #intro {
      background: url('https://raw.githubusercontent.com/BenCizion/Att_self/main/꽃게당 배경 패턴(용량)_6.webp') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 20px;
      padding: 10px 20px;
      background-color: rgba(0,0,0,0.6);
      border-radius: 8px;
    }

    #videoPlayer {
      width: 1280px;
      height: 720px;
      background: #000;
      border: 0;
    }

  </style>
</head>
<body>
  <!-- 인트로 영역 -->
  <div id="intro">
    <h1>YouTube #보아치과 #BoaClinic</h1>
    <!-- YouTube 재생을 위해 iframe 사용 -->
    <iframe id="videoPlayer"
      src=""
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen
      style="width:1280px;height:720px;border:0;">
    </iframe>
  </div>

  <script>
    // 요청하신 유튜브 영상으로 변경 (URL: https://www.youtube.com/watch?v=rSL_HbpbJzI)
    // embed 형식으로 autoplay(1) 및 mute(1) 포함
    const videos = [
      "https://www.youtube.com/embed/rSL_HbpbJzI?autoplay=1&mute=1&playsinline=1&enablejsapi=1"
    ];

    const player = document.getElementById("videoPlayer");
    let current = 0;

    function playNext() {
      player.src = videos[current];
      // 여러 영상을 순환하려면 아래 주석을 해제하세요:
      // current = (current + 1) % videos.length;
    }

    playNext();
  </script>
</body>
</html>
