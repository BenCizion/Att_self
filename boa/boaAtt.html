<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>보아치과 인스타그램 TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw; height: 100vh; min-height: 100vh;
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }
        #intro {
            width: 100vw; height: 100vh;
            background: url('https://raw.githubusercontent.com/BenCizion/Att_self/main/files/보아치과1.png') center/cover no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        h1 {
            color: #fff; font-size: 24px; margin-bottom: 0; padding: 10px 20px;
            background-color: rgba(0,0,0,0.6); border-radius: 8px;
        }

        /* attractt 컨테이너를 크게 보이도록 스타일 조정 */
        .attractt-container {
            /* 원하는 크기로 조정하세요: 현재는 뷰포트 기준으로 크게 설정 */
            width: 90vw;
            max-width: 1500px;
            height: 80vh;
            max-height: 1000px;

            /* 중앙 정렬 및 시각적 안정성 */
            display: block;
            background: transparent;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        /* 내부로 로드되는 iframe 등도 컨테이너에 맞게 채움 */
        .attractt-container,
        .attractt-container iframe,
        .attractt-container embed,
        .attractt-container > * {
            width: 100% !important;
            height: 100% !important;
        }

        /* (선택) 작은 화면에서 더 잘 보이게 반응형 조정 */
        @media (max-width: 600px) {
            h1 { font-size: 18px; padding: 6px 12px; }
            .attractt-container { width: 96vw; height: 60vh; max-width: none; max-height: none; }
        }
    </style>
</head>
<body>
    <div id="intro">
        <h1>Instagram #보아치과 #BoaClinic</h1>
        <script type="text/javascript">
	(function(d, s) {
		var j, e = d.getElementsByTagName(s)[0], h = "https://cdn.attractt.com/embed_v2/index.js";
		if (typeof AttracttTower === "function" || e.src === h) { return; }
		j = d.createElement(s);
		j.src = h;
		j.async = true;
		e.parentNode.insertBefore(j, e);
	})(document, "script");
</script>
<div class="attractt-container" data-idx="0" data-code="TwO8AB7iD5AxyrN" data-board="slide"></div>
    </div>
</body>
</html>
