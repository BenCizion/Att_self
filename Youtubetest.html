<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoaClinic YouTube (open-and-auto-close)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html,body { height: 100%; background:#000; color:#fff; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", Arial; }
    #intro { width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column;
      background: url('https://raw.githubusercontent.com/BenCizion/Att_self/main/files/보아치과1.png') center/cover no-repeat; padding:24px; }
    h1 { background: rgba(0,0,0,0.6); padding:10px 16px; border-radius:8px; margin-bottom:12px; font-size:30px; }
    #playerWrap { width:min(1280px,95%); aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.6); }
    #diag { position: fixed; right:12px; bottom:12px; z-index:9999; background: rgba(0,0,0,0.75); padding:12px; border-radius:8px; max-width:520px; font-size:13px; }
    #diag pre { white-space:pre-wrap; word-break:break-word; margin:0; font-family:inherit; font-size:12px; color:#ddd; }
    #actions { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
    button { background:#111; color:#fff; border:1px solid #333; padding:6px 10px; border-radius:6px; cursor:pointer; }
    button.secondary { background:transparent; border:1px solid #666; }
    .note { margin-top:8px; font-size:12px; color:#cfcfcf; max-width:900px; text-align:center; }
  </style>
</head>
<body>
  <div id="intro" role="main" aria-label="인트로 영역">
    <h1>YouTube #보아치과 #BoaClinic</h1>

    <div id="playerWrap" aria-hidden="false">
      <div id="player"></div>
    </div>

    <div id="actions">
      <button id="btnOpenInNew" class="secondary">YouTube에서 열기 (자동 닫기 2초)</button>
    </div>

    <div class="note">
      자동으로 새 창을 연 뒤 2초 후 닫습니다. (팝업 차단 또는 브라우저 정책에 의해 제한될 수 있습니다.)
    </div>
  </div>

  <div id="diag" aria-live="polite" title="진단 정보">
    <pre id="diagText">초기화 중...</pre>
  </div>

  <script>
    // 배포 origin과 비디오 ID
    const DEPLOY_ORIGIN = 'https://bencizion.github.io';
    const VIDEO_ID = 'rSL_HbpbJzI';

    const diagEl = document.getElementById('diagText');
    function setDiag(text) {
      diagEl.textContent = text;
      console.info('[diag]', text);
    }

    // 기본 진단
    (function baseDiagnostics(){
      const cookies = (function(){ try{ document.cookie = 'test=1; SameSite=Lax'; const ok = document.cookie.indexOf('test=1') !== -1; document.cookie = 'test=; expires=Thu,01 Jan 1970 00:00:00 GMT'; return ok;}catch(e){return false;} })();
      const ls = (function(){ try{ localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); return true;}catch(e){return false;} })();
      const ua = navigator.userAgent || 'unknown';
      let text =
        '하드코딩 origin: ' + DEPLOY_ORIGIN + '\n' +
        '페이지 URL: ' + location.href + '\n' +
        '쿠키 사용 가능: ' + (cookies ? '예' : '아니오') + '\n' +
        '로컬스토리지: ' + (ls ? '예' : '아니오') + '\n' +
        'User Agent: ' + ua + '\n\n' +
        '버튼을 누르면 새 창을 열고 2초 후 자동으로 닫습니다.';
      setDiag(text);
    })();

    // YouTube IFrame API 로드 (플레이어는 그대로 유지)
    (function loadYouTubeAPI(){
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      tag.async = true;
      document.head.appendChild(tag);
    })();

    // IFrame API 콜백 스텁(전역으로 호출됨)
    let player;
    function onYouTubeIframeAPIReady() {
      const playerVars = {
        autoplay: 1,
        mute: 1,
        playsinline: 1,
        controls: 1,
        modestbranding: 1,
        rel: 0,
        iv_load_policy: 3,
        enablejsapi: 1,
        origin: DEPLOY_ORIGIN
      };

      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: VIDEO_ID,
        host: 'https://www.youtube-nocookie.com',
        playerVars: playerVars,
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      setDiag((diagEl.textContent || '') + '\n[IFrame API] onReady 호출. 재생 시도...');
      try { event.target.playVideo(); } catch (e) { console.warn('playVideo 호출 실패', e); }
      setTimeout(()=> logPlayerStatus('ready-timeout'), 1500);
    }

    function onPlayerStateChange(e) {
      const stateMap = { '-1': 'UNSTARTED', '0': 'ENDED', '1': 'PLAYING', '2': 'PAUSED', '3': 'BUFFERING', '5': 'CUED' };
      const s = stateMap[e.data] || ('UNKNOWN('+e.data+')');
      console.info('[YouTube state]', s);
      setDiag((diagEl.textContent || '') + '\n[YT] 상태: ' + s);
    }

    function onPlayerError(e) {
      console.error('[YouTube error]', e);
      setDiag((diagEl.textContent || '') + '\n[YT 오류] 코드: ' + (e.data || 'unknown'));
    }

    function logPlayerStatus(tag) {
      if (!player || !player.getPlayerState) return;
      const state = player.getPlayerState();
      const time = player.getCurrentTime ? player.getCurrentTime() : 'n/a';
      const text = '\n[상태로그:' + tag + '] state=' + state + ', currentTime=' + time;
      setDiag((diagEl.textContent || '') + text);
      console.info('[player status]', { tag, state, time });
    }

    // YouTube 새 창 열기 후 2초 뒤 자동 닫기 및 성공/실패 확인 로직
    (function setupOpenAndAutoClose(){
      const btn = document.getElementById('btnOpenInNew');
      const AUTO_CLOSE_DELAY = 2000; // ms
      const CLOSE_CHECK_INTERVAL = 100; // ms
      const CLOSE_CHECK_TIMEOUT = 5000; // ms (닫힘 확인 최대 대기 시간)

      btn.addEventListener('click', function(){
        const url = 'https://www.youtube.com/watch?v=' + VIDEO_ID;
        setDiag((diagEl.textContent || '') + '\n[사용자 요청] 새 창에서 YouTube 열기 시도: ' + url);

        let win = null;
        try {
          // 'noopener' 제거: 반환된 핸들로 닫을 수 있어야 함
          win = window.open(url, '_blank');
        } catch (err) {
          setDiag((diagEl.textContent || '') + '\n[오류] window.open 호출 중 예외: ' + err);
          console.error(err);
          return;
        }

        // 열기 성공 여부 확인
        if (!win) {
          setDiag((diagEl.textContent || '') + '\n[실패] 새 창을 열 수 없습니다. (팝업 차단 또는 브라우저 정책)');
          return;
        }

        // 일부 브라우저는 즉시 win.closed가 true일 수 있으므로 짧게 대기 후 확인
        try {
          // 성공적으로 핸들을 받았음 — 열기 성공으로 간주
          setDiag((diagEl.textContent || '') + '\n[성공] 새 창이 열렸습니다. 닫기 예약: ' + AUTO_CLOSE_DELAY + 'ms 후');
        } catch (err) {
          // 접근 권한 문제로 프로퍼티 확인이 실패할 수 있음 (극히 드뭄)
          setDiag((diagEl.textContent || '') + '\n[경고] 새 창 열기 후 상태 확인에서 예외 발생: ' + err);
        }

        // 닫기 예약
        setTimeout(() => {
          try {
            // 닫기 시도
            win.close();
            setDiag((diagEl.textContent || '') + '\n[시도] 새 창 닫기 호출을 실행했습니다.');
          } catch (err) {
            setDiag((diagEl.textContent || '') + '\n[오류] 새 창 닫기 호출 예외: ' + err);
            console.error(err);
            return;
          }

          // 닫힘 여부 폴링으로 확인 (cross-origin 환경에서도 win.closed는 확인 가능)
          const start = Date.now();
          const poll = setInterval(() => {
            let closed = false;
            try {
              closed = !!win.closed;
            } catch (err) {
              // 드물게 closed 프로퍼티 접근에 실패할 경우 예외 처리
              setDiag((diagEl.textContent || '') + '\n[경고] 닫힘 확인 중 예외: ' + err);
            }

            if (closed) {
              clearInterval(poll);
              setDiag((diagEl.textContent || '') + '\n[성공] 새 창이 정상적으로 닫혔습니다.');
              return;
            }

            if (Date.now() - start > CLOSE_CHECK_TIMEOUT) {
              clearInterval(poll);
              setDiag((diagEl.textContent || '') + '\n[실패] 새 창이 지정 시간 내에 닫히지 않았습니다. (브라우저 정책 또는 팝업/탭 제약)');
            }
          }, CLOSE_CHECK_INTERVAL);

        }, AUTO_CLOSE_DELAY);
      });
    })();
  </script>
</body>
</html>
