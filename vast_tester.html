<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>티오더 VAST 규격 검증 (1200x750)</title>
  <style>
    body { background: #222; color: white; font-family: sans-serif; text-align: center; }
    
    /* 티오더 화면 크기를 시뮬레이션하는 컨테이너 */
    #mainContainer {
      position: relative;
      width: 1200px; 
      height: 750px;
      border: 5px solid #00ff00; /* 영역 확인용 초록 테두리 */
      margin: 20px auto;
      background: #000;
      box-shadow: 0 0 20px rgba(0,255,0,0.2);
    }
    
    /* 실제 광고가 뜨는 영역 */
    #adContainer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    
    button {
      padding: 10px 20px; font-size: 16px; cursor: pointer;
      background: #00ff00; border: none; font-weight: bold; border-radius: 5px;
    }
  </style>
</head>
<body>
  <br>
  <h2>📺 티오더 VAST 규격 검증기</h2>
  <p>아래 초록색 박스(1200x750) 안에 이미지가 뜨면 <b>XML과 이미지는 100% 정상</b>입니다.</p>
  <button id="playButton">▶ 광고 로드 & 재생 (클릭)</button>
  <br><br>

  <div id="mainContainer">
    <div id="adContainer"></div>
  </div>

  <!-- Google IMA SDK (표준 광고 처리 엔진) 로드 -->
  <script type="text/javascript" src="//imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
  <script type="text/javascript">
    var adDisplayContainer;
    var adsLoader;
    var adsManager;

    function init() {
      // 컨테이너 설정
      adDisplayContainer = new google.ima.AdDisplayContainer(
          document.getElementById('adContainer'));
      adDisplayContainer.initialize();

      // 로더 설정
      adsLoader = new google.ima.AdsLoader(adDisplayContainer);
      adsLoader.addEventListener(
          google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
          onAdsManagerLoaded, false);
      adsLoader.addEventListener(
          google.ima.AdErrorEvent.Type.AD_ERROR,
          onAdError, false);

      // ★ 핵심: VAST URL 요청
      var adsRequest = new google.ima.AdsRequest();
      adsRequest.adTagUrl = 'https://attractt.livere.org/3SwYxPrHIjtMpYA/vast'; 

      // ★ 핵심: 요청 사이즈를 1200x750으로 강제 지정 (이게 없으면 503 에러 남)
      adsRequest.linearAdSlotWidth = 1200;
      adsRequest.linearAdSlotHeight = 750;
      adsRequest.nonLinearAdSlotWidth = 1200;
      adsRequest.nonLinearAdSlotHeight = 750;

      adsLoader.requestAds(adsRequest);
    }

    function onAdsManagerLoaded(adsManagerLoadedEvent) {
      console.log("Ads Manager Loaded! (성공)");
      adsManager = adsManagerLoadedEvent.getAdsManager(
          document.getElementById('mainContainer')); 

      adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError);
      
      try {
        // 광고 시작 (1200x750 크기로 초기화)
        adsManager.init(1200, 750, google.ima.ViewMode.NORMAL);
        adsManager.start();
      } catch (adError) {
        console.log("Ads Manager Init Error:", adError);
      }
    }

    function onAdError(adErrorEvent) {
      // 에러 발생 시 알림창 띄움
      console.log("Ad Error:", adErrorEvent.getError());
      alert("❌ 에러 발생: " + adErrorEvent.getError());
    }

    document.getElementById('playButton').addEventListener('click', init);
  </script>
</body>
</html>
