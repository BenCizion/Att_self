<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torder VAST Load Test (1280x800)</title>
    
    <style>
        body { margin: 0; background-color: #333; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; }
        .player-container {
            width: 1280px;
            height: 800px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); /* 잘 보이도록 흰색 테두리 */
        }
        #load-status {
            color: #fff;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>

    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/videojs-ima/1.12.0/videojs.ima.css" rel="stylesheet" />
</head>
<body>

    <div id="load-status">VAST 로딩 및 이미지 표시 대기 중...</div>

    <div class="player-container">
        <video id="ad-player" class="video-js vjs-default-skin" controls preload="auto" 
               width="1280" height="800" playsinline muted>
        </video>
    </div>

    <script src="https://vjs.zencdn.net/8.6.1/video.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-ads/7.2.1/videojs.ads.min.js"></script>
    <script src="https://imasdk.googleapis.com/js/sdkloader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-ima/1.12.0/videojs.ima.min.js"></script>
    
    <script>
        // Step 1에서 만든 mock_vast.xml 파일의 URL (절대 경로 또는 상대 경로)
        const MOCK_VAST_URL = "[ https://bencizion.github.io/Att_self/torder.xml ]"; 
        
        const player = videojs('ad-player', {
            ima: {
                adTagUrl: MOCK_VAST_URL, 
                nonLinearAdSlot: document.getElementById('ad-player'),
            },
            loop: true, 
            muted: true,
            autoplay: true 
        }, function() {
            const statusDisplay = document.getElementById('load-status');
            
            // IMA SDK 로딩 성공 시
            player.on('adsready', function() {
                statusDisplay.textContent = "✅ 광고 준비 완료! (VAST XML 정상 호출됨)";
                // 광고 요청 시작
                player.ima.requestAds();
            });

            // 광고 재생 시작 시 (이미지 노출 확인)
            player.on('adplay', function() {
                statusDisplay.textContent = "✅ 광고 재생 중! (1280x800 이미지 정상 노출됨)";
            });

            // 오류 발생 시
            player.on('aderror', function(e) {
                statusDisplay.textContent = "❌ 오류 발생! (콘솔 확인 필요)";
                console.error("VAST/IMA Error:", e);
            });
        });
    </script>
</body>
</html>
