<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linear Video Ad Test (1280x720)</title>

    <link href="https://cdn.jsdelivr.net/npm/video.js@8.6.1/dist/video-js.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/videojs-ima@1.12.0/dist/videojs.ima.css" rel="stylesheet" crossorigin="anonymous" />

    <style>
        body {
            margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        #ad-player {
            width: 1280px; height: 720px;
        }
    </style>
</head>
<body>

    <video id="ad-player" class="video-js vjs-default-skin" controls preload="auto" playsinline muted></video>

    <script src="https://cdn.jsdelivr.net/npm/video.js@8.6.1/dist/video.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-ads@7.2.1/dist/videojs-contrib-ads.min.js" crossorigin="anonymous"></script>
    <script src="https://imasdk.googleapis.com/js/sdkloader.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-ima@1.12.0/dist/videojs.ima.min.js" crossorigin="anonymous"></script>

    <script>
        const VAST_LINEAR_URL = "https://bencizion.github.io/Att_self/torder.xml";

        const player = videojs('ad-player', {
            ima: {
                adTagUrl: VAST_LINEAR_URL
            },
            autoplay: true,
            muted: true,
            controls: true
        }, function() {
            console.log('Player initialized for Linear Ad.');

            player.on('adsready', () => {
                console.log('Ads are ready.');
                player.ima.requestAds();
            });

            player.on('adstart', () => {
                console.log('Ad started.');
            });

            player.on('adend', () => {
                console.log('Ad ended.');
            });

            player.on('aderror', (e) => {
                console.error('Ad error:', e);
            });
        });
    </script>

</body>
</html>
