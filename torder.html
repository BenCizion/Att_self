<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>티오더x시지온</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
    }

    #intro, #board {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    #intro {
      background: url() center/cover no-repeat; // 배경 추가
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 20px;
      padding: 10px 20px;
      background-color: rgba(0,0,0,0.6);
      border-radius: 8px;
    }

    #videoPlayer {
      width: 1280px;
      height: 720px;
      background: #000;
    }

  </style>
</head>
<body>
  <!-- 인트로 영역 -->
  <div id="intro">
    <h1>Instagram #티오더 #TORDER</h1>
  </div>

  -- 어트랙트 보드 --
</body>
</html>
