<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>허준박물관 야외 어트랙트 디스플레이</title>
    <style>
        /* 기본 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 디스플레이 해상도 (1920x1080) 전체를 사용하도록 설정 */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 스크롤 방지 */
            /* 배경색: 밝은 톤으로 변경하여 전환 시 흰색 깜빡임 방지 및 명료도 향상 */
            background-color: #F8F8F8; 
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 메인 컨테이너: 밝은 톤 적용 */
        #display-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #FFFFFF; /* 흰색 배경 */
            color: #333333; /* 어두운 회색 텍스트 */
            padding: 40px 15px 40px 15px; /* 상하 여백 증가 (맨 아래 여백 확보) */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05); /* 은은한 그림자 효과 */
        }

        /* 박물관 헤더 및 브랜드 강조 */
        .museum-header {
            width: 100%;
            text-align: center;
            padding: 20px 0 20px 0;
            margin-bottom: 20px; /* 헤더와 안내 문구 사이 간격 */
        }
        
        .museum-header .title-group {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 15px; /* 한글 제목과 영문 제목 사이 간격 */
            line-height: 1.2;
        }

        .museum-header .title-group h1 {
            /* 한글 제목 */
            font-size: 72px; /* 폰트 크기 조정 */
            font-weight: 800;
            color: #333333; /* 어두운 색상 */
        }

        .museum-header .title-group small {
            /* 영문 제목 */
            font-size: 40px;
            font-weight: 500;
            color: #555555;
        }

        /* 안내 문구 스타일 */
        .info-text {
            font-size: 32px;
            font-weight: 400;
            color: #008080; /* 강조색 (청록색) 사용 */
            margin-bottom: 40px; /* 안내 문구와 어트랙트 보드 사이 간격 */
            padding: 10px 20px;
            border: 2px solid #008080;
            border-radius: 8px;
            letter-spacing: -0.5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* 어트랙트 컨테이너가 나머지 공간을 모두 채우도록 설정 */
        .attractt-container {
            width: 99%;
            flex-grow: 1; /* 남은 수직 공간을 모두 차지 */
            min-height: 0;
            border-radius: 12px; /* 모서리 둥글게 */
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1); /* 콘텐츠 강조 */
        }
    </style>
</head>
<body>
    <div id="display-wrapper">
        <header class="museum-header">
            <div class="title-group">
                <h1>허준박물관</h1>
                <small>HEO JUN MUSEUM</small>
            </div>
            <!-- 부제목 변경 -->
            <small style="font-size: 30px; font-weight: 300; color: #555;">Social Media Display</small>
        </header>
        
        <!-- 2. 인스타그램 해시태그 안내 문구 추가 -->
        <p class="info-text">
            #허준박물관 해시태그를 넣어, 인스타그램에 올려주시면, 선별하여 노출합니다.
        </p>

        <!-- Attractt 임베드 코드 시작 -->
        <script type="text/javascript">
            (function(d, s) {
                var j, e = d.getElementsByTagName(s)[0], h = "https://cdn.attractt.com/embed_v2/index.js";
                if (typeof AttracttTower === "function" || e.src === h) { return; }
                j = d.createElement(s);
                j.src = h;
                j.async = true;
                e.parentNode.insertBefore(j, e);
            })(document, "script");
        </script>
        <div class="attractt-container" data-idx="0" data-code="XlEDr74EQCHrYpo" data-board="slide"></div>
        <!-- Attractt 임베드 코드 끝 -->

    </div>
</body>
</html>
