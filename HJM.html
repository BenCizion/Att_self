<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>허준박물관 야외 어트랙트 디스플레이</title>
    <style>
        /* 기본 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 디스플레이 해상도 (7087x2835) 전체를 사용하도록 설정 */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 스크롤 방지 */
            /* 배경색: 밝은 톤 유지 */
            background-color: #F8F8F8; 
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 메인 컨테이너: 밝은 톤 적용 */
        #display-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #FFFFFF; /* 흰색 배경 */
            color: #333333; /* 어두운 회색 텍스트 */
            /* 초고해상도에 맞춰 패딩 대폭 확대 (하단 250px 여백 확보) */
            padding: 60px 30px 250px 30px; 
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1); /* 그림자 효과 확대 */
        }

        /* 박물관 헤더 및 브랜드 강조 */
        .museum-header {
            width: 100%;
            text-align: center;
            padding: 30px 0; /* 상하 패딩 조정 */
            margin-bottom: 20px; /* 마진 조정 */
        }
        
        .museum-header .title-group {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 40px; /* 간격 확대 */
            line-height: 1.2;
        }

        .museum-header .title-group h1 {
            /* 한글 제목 - 초고해상도에 맞춰 대폭 확대 */
            font-size: 180px; 
            font-weight: 800;
            color: #333333;
        }

        .museum-header .title-group small {
            /* 영문 제목 - 한글 제목과 동일하게 확대 */
            font-size: 180px;
            font-weight: 500;
            color: #555555;
        }

        /* 안내 문구 스타일 */
        .info-text {
            font-size: 100px; /* 폰트 크기 확대 */
            font-weight: 400;
            color: #008080; /* 강조색 (청록색) 사용 */
            margin-bottom: 40px; /* 마진 확대 */
            padding: 20px 40px; /* 패딩 확대 */
            border: 5px solid #008080; /* 테두리 두께 확대 */
            border-radius: 20px;
            letter-spacing: -1px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        /* 어트랙트 컨테이너가 나머지 공간을 모두 채우도록 설정 */
        .attractt-container {
            /* 5x2 배열 및 초고해상도에 맞춰 가로 폭을 6800px로 확장 */
            width: 6800px; 
            flex-grow: 1; /* 남은 수직 공간을 모두 차지 */
            min-height: 0; 
            border-radius: 30px; /* 모서리 둥글게 확대 */
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); /* 콘텐츠 강조 확대 */
        }
    </style>
</head>
<body>
    <div id="display-wrapper">
        <header class="museum-header">
            <div class="title-group">
                <h1>허준박물관</h1>
                <small>HEO JUN MUSEUM</small>
            </div>
        </header>
        
        <!-- 인스타그램 해시태그 안내 문구 -->
        <p class="info-text">
            #허준박물관 #방문리뷰 해시태그를 넣어, 인스타그램에 올려주시면, 선별하여 노출합니다.
        </p>

        <!-- Attractt 임베드 코드 시작 -->
        <script type="text/javascript">
            (function(d, s) {
                var j, e = d.getElementsByTagName(s)[0], h = "https://cdn.attractt.com/embed_v2/index.js";
                if (typeof AttracttTower === "function" || e.src === h) { return; }
                j = d.createElement(s);
                j.src = h;
                j.async = true;
                e.parentNode.insertBefore(j, e);
            })(document, "script");
        </script>
        <div class="attractt-container" data-idx="0" data-code="XlEDr74EQCHrYpo" data-board="slide"></div>
        <!-- Attractt 임베드 코드 끝 -->

    </div>
</body>
</html>
